<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1830">
<meta name="mobile-web-app-capable" content="yes">
<title>Trabant</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%;
    background:#0E1830;
    overflow:hidden; overscroll-behavior:none;
    position:fixed; inset:0;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    transition: background 600ms ease;
  }
  #wrap { height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="tz" aria-label="Trabant – von der Sonne bis zum Rand des beobachtbaren Universums. Halten lässt den Kometen in den Schwerkrafttrichter stürzen, loslassen schleudert ihn hinaus"></canvas></div>
<script>
"use strict";
// ---------- Stellschrauben ----------
const W = 360; let H = 640;                  // Bildschirm-Breite in Spieleinheiten; Höhe passt sich dem Handy an
const K_HOLD = 1.6;                          // Halten: Schwerkraft des Planeten x1,6, der Komet stürzt hinein
const CAPF = [2.0, 1.2];                     // Einfangen, wenn v² < CAPF · 2μ/d (Ziel 1 → letztes Ziel)
const PERFECT = 0.45;                        // perfekter Einflug: Anteil der Geschwindigkeit zur Mitte < 0,3
const FEVER_CHAIN = 3, FEVER_T = 8;          // drei perfekte Einflüge in Folge → 8 s Fieber
const LIGHT_START = 25;                      // Sekunden Licht zu Beginn
const DRAG = 120, V_DEAD = 30;               // Flug: Abbremsen in px/s², darunter verglüht der Schwung
const V_LAUNCH = 230, SW_MAX = 3;            // Abfluggeschwindigkeit bei Schwung 1; Reichweite wächst linear mit dem Schwung
const AIM_HELP = 0.26;                       // Zielhilfe: bis zu 15° wird zum nächsten Ziel nachgelenkt
const SLOWMO = 0.3;                          // Zeitlupe, solange die Vorschau ein Ziel trifft
const F = 'Georgia, serif';

const SETS = [
  { name: 'Mitternacht', paper: '#0E1830', deep: '#2B4785', a: '#FF4F79', b: '#6FE3C0', cream: '#EFE7D6' },
  { name: 'Tiefsee',     paper: '#06201E', deep: '#0F4A44', a: '#FF7A5C', b: '#7FE9D0', cream: '#E9F1E4' },
  { name: 'Traube',      paper: '#1A0E2A', deep: '#46237A', a: '#FFD166', b: '#EF476F', cream: '#F2E9F7' },
  { name: 'Rost',        paper: '#221208', deep: '#5A2A18', a: '#FF9A3C', b: '#6BC5B8', cream: '#F3E6D6' },
  { name: 'Moor',        paper: '#0B1A14', deep: '#1E4634', a: '#F2545B', b: '#C6F24E', cream: '#EDF2E4' },
  { name: 'Kobalt',      paper: '#0A1230', deep: '#1E3AA8', a: '#FF5CAA', b: '#FFE066', cream: '#E8ECFF' },
  { name: 'Asche',       paper: '#14131A', deep: '#3A3750', a: '#E0FF4F', b: '#FF6B6B', cream: '#EDEBE4' }
];

// Echte Entfernungen von der Sonne bzw. der Erde (NASA Planetary Fact Sheet, Voyager, Gaia, JWST).
// Ab Proxima: Lichtjahre; bei den fernsten Galaxien die Lichtlaufzeit.
const LJ = 9.461e12;
const STAGES = [
  { name: 'Merkur',  km: 57.9e6,   diam: 4879,   label: '58 Mio. km',   look: 'rock',  col: 'cream' },
  { name: 'Venus',   km: 108.2e6,  diam: 12104,  label: '108 Mio. km',  look: 'veil',  col: 'a' },
  { name: 'Erde',    km: 149.6e6,  diam: 12756,  label: '150 Mio. km',  look: 'moon',  col: 'b' },
  { name: 'Mars',    km: 228.0e6,  diam: 6792,   label: '228 Mio. km',  look: 'rock',  col: 'a' },
  { name: 'Jupiter', km: 778.5e6,  diam: 142984, label: '779 Mio. km',  look: 'bands', col: 'cream' },
  { name: 'Saturn',  km: 1432e6,   diam: 120536, label: '1,43 Mrd. km', look: 'ring',  col: 'a' },
  { name: 'Uranus',  km: 2867e6,   diam: 51118,  label: '2,87 Mrd. km', look: 'tilt',  col: 'b' },
  { name: 'Neptun',  km: 4515e6,   diam: 49528,  label: '4,52 Mrd. km', look: 'spot',  col: 'b' },
  { name: 'Pluto',   km: 5906e6,   diam: 2377,   label: '5,9 Mrd. km',  look: 'pluto', col: 'cream', note: 'Kuipergürtel · New Horizons 2015' },
  { name: 'Heliopause', km: 18.1e9, body: 13, label: '18 Mrd. km', look: 'helio', note: 'Rand der Sonnenblase · Voyager 1, 2012' },
  { name: 'Proxima Centauri b', km: 4.24 * LJ, body: 15, label: '4,2 Lichtjahre', look: 'star', note: 'nächster bekannter Exoplanet' },
  { name: 'TRAPPIST-1', km: 40.7 * LJ, body: 15, label: '41 Lichtjahre', look: 'trappist', note: 'sieben erdgroße Planeten' },
  { name: 'Orionnebel', km: 1344 * LJ, body: 20, label: '1.344 Lichtjahre', look: 'nebula', note: 'hier entstehen Sterne' },
  { name: 'Sagittarius A*', km: 27000 * LJ, body: 16, label: '27.000 Lichtjahre', look: 'hole', note: 'Schwarzes Loch im Zentrum der Milchstraße' },
  { name: 'Große Magellansche Wolke', km: 160000 * LJ, body: 20, label: '160.000 Lichtjahre', look: 'cloud', note: 'Nachbargalaxie' },
  { name: 'Andromeda', km: 2.5e6 * LJ, body: 22, label: '2,5 Mio. Lichtjahre', look: 'spiral', note: 'nächste große Galaxie' },
  { name: 'JADES-GS-z14-0', km: 13.4e9 * LJ, body: 14, label: '13,4 Mrd. Lichtjahre', look: 'faint', note: 'eine der fernsten Galaxien · JWST 2024' },
  { name: 'Hintergrundstrahlung', km: 13.8e9 * LJ, body: 24, label: '13,8 Mrd. Lichtjahre', look: 'cmb', note: 'Rand des beobachtbaren Universums' }
];

// ---------- Leinwand ----------
const cv = document.getElementById('tz'), ctx = cv.getContext('2d');
const meta = document.querySelector('meta[name=theme-color]');
let scale = 1, dpr = 1, grain, vign, dotsP;
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  H = Math.round(Math.min(820, Math.max(560, W * vh / vw)));
  scale = Math.min(vw / W, vh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  vign = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78);
  vign.addColorStop(0, 'rgba(6,8,18,0)');
  vign.addColorStop(1, 'rgba(6,8,18,0.55)');
}

// ---------- Druck-Helfer ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 110;
  const g = c.getContext('2d'), d = g.createImageData(110, 110);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = Math.random() < 0.42 ? 42 : 0;
  }
  g.putImageData(d, 0, 0);
  return ctx.createPattern(c, 'repeat');
}
function makeDots(col) {
  const c = document.createElement('canvas'); c.width = c.height = 4;
  const g = c.getContext('2d');
  g.fillStyle = col; g.beginPath(); g.arc(2, 2, 0.95, 0, 6.283); g.fill();
  return ctx.createPattern(c, 'repeat');
}
function wob(n, amp) {
  const a = [], p1 = Math.random() * 6.3, p2 = Math.random() * 6.3;
  const f1 = 2 + Math.floor(Math.random() * 2), f2 = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const u = i / n * 6.283;
    a.push((Math.sin(u * f1 + p1) * 0.62 + Math.sin(u * f2 + p2) * 0.38) * amp);
  }
  return a;
}
function inkPath(cx, cy, r, w, rot) {
  const n = w.length;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const u = i / n * 6.283 + rot, rr = r * (1 + w[i % n]);
    const x = cx + Math.cos(u) * rr, y = cy + Math.sin(u) * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
function txt(s, x, y, size, col, sh, al, j) {
  ctx.font = '400 ' + size.toFixed(1) + 'px ' + F;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.16);
  ctx.globalAlpha = al * 0.7; ctx.strokeStyle = K.paper; ctx.strokeText(s, x, y);
  if (sh) { ctx.globalAlpha = al * 0.6; ctx.fillStyle = sh; ctx.fillText(s, x - 2.5 + j, y + 2.5); }
  ctx.globalAlpha = al; ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}
function panel(x, y, w, h) {
  const j = Math.sin(t * 1.6) * 1.2;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.5; ctx.strokeStyle = K.b; ctx.strokeRect(x - 2.5 + j, y + 2.5, w, h);
  ctx.globalAlpha = 0.92; ctx.fillStyle = K.paper; ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 0.75; ctx.strokeStyle = K.cream; ctx.strokeRect(x, y, w, h);
  ctx.globalAlpha = 1;
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {} }

// ---------- Welt ----------
// Jeder Koerper hat eine Umlaufbahn (R0), ein Schwerefeld (field) und eine Schwerkraft μ,
// die auf der Umlaufbahn eine Runde in T Sekunden ergibt. Spaetere Ziele drehen schneller.
function setupBody(p, i) {
  p.R0 = p.body * 2.1 + 24;
  p.field = p.R0 * 1.75;
  const T = Math.max(2.2, 3.2 - i * 0.05);
  p.v0 = 2 * Math.PI * p.R0 / T;
  p.mu = p.v0 * p.v0 * p.R0;
  p.capf = CAPF[0] + (CAPF[1] - CAPF[0]) * Math.min(1, i / (STAGES.length - 1));
  p.vis = visuals();
  return p;
}
function visuals() {
  return { wr: wob(40, 0.028), wc: wob(34, 0.05), ox: rnd(-2.6, 2.6), oy: rnd(-2.6, 2.6), cs: rnd(-0.4, 0.4), rs: rnd(-0.22, 0.22), phase: rnd(0, 6.283),
    pts: Array.from({ length: 70 }, () => ({ a: rnd(0, 6.283), r: Math.sqrt(Math.random()), s: rnd(0.5, 1.8), k: Math.random() })) };
}
// Abstaende logarithmisch aus den echten Entfernungen: jede Verzehnfachung ≈ 70 Einheiten mehr
function buildWorld() {
  planets = [setupBody({ name: 'Sonne', look: 'sun', body: 26, x: W / 2, y: 0, label: '' }, 0)];
  STAGES.forEach((s, i) => {
    const p = Object.assign({}, s);
    if (!p.body) p.body = Math.max(6, 8 + 4.5 * Math.log(s.diam / 4879));
    setupBody(p, i + 1);
    const prev = planets[i];
    const lg = i === 0 ? 0.3 : Math.log10(s.km / STAGES[i - 1].km);
    p.gap = Math.max(prev.field + p.field + 45, 150 + 70 * lg);
    const dx = rnd(-1, 1) * Math.min(100, p.gap * 0.4);
    p.x = clamp(prev.x + dx, 75, W - 75);
    p.y = prev.y - Math.sqrt(Math.max(p.gap * p.gap - (p.x - prev.x) ** 2, p.gap * p.gap * 0.5));
    planets.push(p);
  });
  // Asteroidenguertel zwischen Mars und Jupiter, Kuipergürtel hinter Neptun
  belts = [];
  for (const [a, b, label] of [[4, 5, 'Asteroidengürtel'], [8, 9, 'Kuipergürtel']]) {
    const y0 = planets[a].y - planets[a].field - 10, y1 = planets[b].y + planets[b].field + 10;
    for (let i = 0; i < 70; i++) belts.push({ x: rnd(-60, W + 60), y: rnd(y1, y0), s: rnd(0.6, 1.7), al: rnd(0.2, 0.5) });
    belts.push({ x: W - 70, y: (y0 + y1) / 2, label });
  }
}

// ---------- Zustand ----------
let K = SETS[0], palBase = 0, best = 0, showTitle = true;
try { best = +localStorage.getItem('trabant.orbit.best') || 0; } catch (_) {}
let state = 'ready', prev = 'play', holding = false, cause = '';
let planets, belts, c, reached, light, score, chain, fever, flightFrom;
let trail, bits, pops, specks, clouds, preview = { pts: [], res: null };
let zoom = 1, camX = 0, camY = 0;
let t = 0, deadT = 0, flash = 0, shake = 0, intro = 0, banner = null, gx = 0, gy = 0;

function setPalette(i) {
  K = SETS[(palBase + i) % SETS.length];
  dotsP = makeDots(K.paper);
  document.body.style.background = K.paper;
  if (meta) meta.setAttribute('content', K.paper);
}

function reset() {
  palBase = Math.floor(Math.random() * SETS.length);
  setPalette(0);
  buildWorld();
  const s = planets[0], a = rnd(0, 6.283);
  c = { x: s.x + Math.cos(a) * s.R0, y: s.y + Math.sin(a) * s.R0, vx: -Math.sin(a) * s.v0, vy: Math.cos(a) * s.v0, mode: 'orbit', p: 0, flightT: 0 };
  reached = 0; light = LIGHT_START; score = 0; chain = 0; fever = 0;
  holding = false; deadT = 0; flash = 0; shake = 0; banner = null; cause = '';
  trail = []; bits = []; pops = [];
  zoom = 1; camX = s.x - W / 2; camY = s.y - H * 0.6;
  state = 'ready';
  intro = showTitle ? 0 : 2.4;
  specks = [];
  for (let i = 0; i < 110; i++) specks.push({ x: rnd(0, W), y: rnd(0, H * 3), s: rnd(0.5, 1.9), p: rnd(0.03, 0.15), a: rnd(0.2, 0.7), ph: rnd(0, 6.3), pk: Math.random() < 0.15 });
  clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: rnd(40, W - 40), y: rnd(0, H * 3), r: rnd(70, 170), w: wob(30, 0.12), sp: rnd(-0.06, 0.06) });
}

// ---------- Physik ----------
// Schwung: 0 auf der normalen Umlaufbahn, ab 1 reicht er zum Abflug.
function energy(s) { const p = planets[s.p]; return (s.vx * s.vx + s.vy * s.vy) / 2 - p.mu / Math.hypot(s.x - p.x, s.y - p.y); }
function schwung(s) { const p = planets[s.p]; return 1 + energy(s) / (p.mu / (2 * p.R0)); }

// Ein Schritt fuer einen Kometen-Zustand s. Liefert ein Ereignis oder null.
function sim(s, dt, heavy) {
  if (s.mode === 'orbit') {
    // Umlaufbahn: nur der eigene Koerper zieht; beim Halten staerker, dann stuerzt der Komet hinein
    const p = planets[s.p], dx = s.x - p.x, dy = s.y - p.y, d = Math.hypot(dx, dy);
    const a = p.mu * (heavy && d > p.body + 8 ? K_HOLD : 1) / (d * d);
    s.vx -= a * dx / d * dt; s.vy -= a * dy / d * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    const ex = s.x - p.x, ey = s.y - p.y, d2 = Math.hypot(ex, ey);
    // Zu tief gestuerzt: Der Komet streift den Planeten und prallt mit Tempoverlust ab
    if (d2 < p.body + 4) {
      const ux = ex / d2, uy = ey / d2, vr = s.vx * ux + s.vy * uy;
      s.x = p.x + ux * (p.body + 4); s.y = p.y + uy * (p.body + 4);
      if (vr < 0) { s.vx -= 1.6 * vr * ux; s.vy -= 1.6 * vr * uy; s.vx *= 0.8; s.vy *= 0.8; return { bump: s.p }; }
    }
    // Rand des Schwerefelds wirkt wie eine Schuesselwand: der Komet prallt zurueck, der Schwung bleibt
    if (d2 > p.field) {
      const ux = ex / d2, uy = ey / d2, vr = s.vx * ux + s.vy * uy;
      s.x = p.x + ux * p.field; s.y = p.y + uy * p.field;
      if (vr > 0) { s.vx -= 2 * vr * ux; s.vy -= 2 * vr * uy; }
    }
    // Mindesttempo wie bei Tiny Wings: unter die normale Umlaufbahn faellt der Schwung nie; nach oben gedeckelt
    const e = (s.vx * s.vx + s.vy * s.vy) / 2 - p.mu / d2, eMin = -p.mu / (2 * p.R0), eMax = (SW_MAX - 1) * p.mu / (2 * p.R0);
    if ((!heavy && e < eMin) || e > eMax) {
      const v = Math.hypot(s.vx, s.vy), need = Math.sqrt(2 * ((e < eMin ? eMin : eMax) + p.mu / d2));
      s.vx *= need / v; s.vy *= need / v;
    }
    return null;
  }
  // Flug: geradeaus, gebremst; im Schwerefeld eines Koerpers zieht dieser den Kometen an
  const v = Math.hypot(s.vx, s.vy), nv = Math.max(0, v - DRAG * dt), f = v > 0 ? nv / v : 0;
  s.vx *= f; s.vy *= f;
  for (let j = 0; j < planets.length; j++) {
    if (j === s.from && !s.left) continue;
    const p = planets[j], dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy);
    if (d > p.field) continue;
    const a = p.mu / (d * d);
    s.vx += a * dx / d * dt; s.vy += a * dy / d * dt;
  }
  s.x += s.vx * dt; s.y += s.vy * dt;
  s.flightT += dt;
  const home = planets[s.from];
  if (!s.left && Math.hypot(s.x - home.x, s.y - home.y) > home.field) s.left = true;
  for (let j = 0; j < planets.length; j++) {
    if (j === s.from && !s.left) continue;
    const p = planets[j], d = Math.hypot(s.x - p.x, s.y - p.y);
    // Eingefangen, wenn der Komet langsam genug fuer die Schwerkraft dieses Koerpers ist
    if (d < p.body + 6 || (d < p.field && (s.vx * s.vx + s.vy * s.vy) < p.capf * 2 * p.mu / d)) return { capture: j };
  }
  if (Math.hypot(s.vx, s.vy) < V_DEAD || s.flightT > 6 || s.x < -160 || s.x > W + 160 || s.y > home.y + 420) return { lost: true };
  return null;
}

// Abflug geradeaus in Flugrichtung. Zielhilfe: liegt ein Ziel knapp daneben, wird leicht nachgelenkt.
function launch(s, assist) {
  const v0 = Math.hypot(s.vx, s.vy), ux = s.vx / v0, uy = s.vy / v0;
  const v = V_LAUNCH * Math.sqrt(clamp(schwung(s), 1, SW_MAX));
  s.from = s.p; s.mode = 'flight'; s.left = false; s.flightT = 0;
  s.vx = ux * v; s.vy = uy * v;
  if (!assist) return;
  let bestA = AIM_HELP, ang = 0;
  for (let j = s.p + 1; j < Math.min(planets.length, s.p + 5); j++) {
    const p = planets[j], dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy);
    const a = Math.atan2(ux * dy - uy * dx, ux * dx + uy * dy);
    if (Math.abs(a) < bestA) { bestA = Math.abs(a); ang = a; }
  }
  const ca = Math.cos(ang), sa = Math.sin(ang);
  s.vx = (ux * ca - uy * sa) * v; s.vy = (ux * sa + uy * ca) * v;
}

// Was passiert, wenn jetzt losgelassen wird? Fuer die gepunktete Vorschau.
function predict() {
  const s = { x: c.x, y: c.y, vx: c.vx, vy: c.vy, mode: c.mode, p: c.p, from: c.from, left: c.left, flightT: c.flightT };
  const pts = [];
  let res = null, sw = 0;
  if (s.mode === 'orbit') {
    sw = schwung(s);
    if (sw < 1) {
      for (let i = 0; i < 0.6 * 120; i++) { sim(s, 1 / 120, holding); if (i % 6 === 0) pts.push(s.x, s.y); }
      return { pts, res: { orbit: true }, sw, x: s.x, y: s.y };
    }
    launch(s, true);
  } else return { pts, res: { flying: true }, sw, x: s.x, y: s.y };
  for (let i = 0; i < 4 * 120 && !res; i++) {
    res = sim(s, 1 / 120, false);
    if (i % 5 === 0) pts.push(s.x, s.y);
  }
  return { pts, res: res || { lost: true }, sw, x: s.x, y: s.y };
}

function burst(x, y, n, sp) {
  const sx = (x - camX) * zoom, sy = (y - camY) * zoom;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = sp * (0.35 + Math.random());
    bits.push({ x: sx, y: sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, r: rnd(0.8, 2.7), c: i % 2 ? K.a : K.b });
  }
}
function pop(a, b, col) { pops.push({ x: W / 2, y: H - 34, a, b, col: col || K.a, life: 1.5 }); }

function capture(j) {
  const p = planets[j], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy);
  const ux = dx / d, uy = dy / d, v = Math.hypot(c.vx, c.vy) || 1;
  const vr = c.vx * ux + c.vy * uy, tx = -uy, ty = ux, sign = c.vx * tx + c.vy * ty >= 0 ? 1 : -1;
  const perfect = Math.abs(vr) / v < PERFECT;
  // Einflug flach (tangential) = perfekt: der Schwung bleibt; steil = holprig
  const vc = Math.sqrt(p.mu / d);
  const sp = perfect ? clamp(v, vc * 0.72, vc * 1.2) : clamp(v * 0.7, vc * 0.72, vc * 0.95);
  c.vx = tx * sign * sp; c.vy = ty * sign * sp;

  planets.forEach((p, i) => {
    ctx.globalAlpha = i <= reached ? 0.95 : 0.4; ctx.fillStyle = i === 0 ? K.a : i <= reached ? K.b : K.cream;
    dot(px(p.y), y, i === 0 ? 3.5 : i < 9 ? 1.6 : 2.3);
  });
  ctx.globalAlpha = 0.5; ctx.fillStyle = K.b; dot(px(c.y) - 1.5, y + 1.5, 3.4);
  ctx.globalAlpha = 1; ctx.fillStyle = K.a; dot(px(c.y), y, 3.2);
}
function drawLight() {
  const w = 150, x = W / 2 - w / 2, y = 34, f = clamp(light / 30, 0, 1);
  ctx.globalAlpha = 0.35; ctx.strokeStyle = K.cream; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, 6);
  ctx.globalAlpha = light < 5 && Math.sin(t * 10) > 0 ? 0.5 : 0.95; ctx.fillStyle = fever > 0 ? K.b : light < 5 ? K.cream : K.a;
  ctx.fillRect(x, y, w * f, 6);
  ctx.globalAlpha = 1;
  txt((fever > 0 ? 'Fieber · ' : 'Licht ') + Math.ceil(light) + ' s', W / 2, y + 20, 10.5, K.cream, null, 0.7, 0);
}

function draw() {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = K.paper; ctx.fillRect(0, 0, W, H);
  const M = H * 3;
  ctx.fillStyle = K.deep; ctx.globalAlpha = 0.2;
  for (const cl of clouds) {
    let y = ((cl.y - camY * 0.04) % M + M) % M;
    if (y > H + cl.r) y -= M;
    if (y + cl.r > 0) { inkPath(cl.x + Math.sin(t * 0.3 + cl.r) * 6, y, cl.r, cl.w, t * cl.sp); ctx.fill(); }
  }
  for (const s of specks) {
    const y = ((s.y - camY * s.p) % M + M) % M;
    if (y > H + 2) continue;
    ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(t * 1.6 + s.ph));
    ctx.fillStyle = s.pk ? K.a : K.cream;
    dot(s.x, y, s.s);
  }
  ctx.globalAlpha = 1;

  // Spielwelt
  ctx.save();
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * 18 * shake; sy = (Math.random() - 0.5) * 18 * shake; }
  ctx.setTransform(dpr * scale * zoom, 0, 0, dpr * scale * zoom, dpr * scale * (sx - camX * zoom), dpr * scale * (sy - camY * zoom));
  for (const d of belts) {
    if (d.label) { txt(d.label, d.x, d.y, 10 / Math.sqrt(zoom), K.cream, null, 0.4, 0); continue; }
    ctx.globalAlpha = d.al * (0.7 + 0.3 * Math.sin(t * 1.3 + d.x)); ctx.fillStyle = K.cream; dot(d.x, d.y, d.s);
  }
  ctx.globalAlpha = 1;
  planets.forEach(drawPlanet);
  drawPreview();
  drawComet();
  ctx.restore();

  for (const b of bits) { ctx.globalAlpha = Math.max(0, b.life) * 0.85; ctx.fillStyle = b.c; dot(b.x, b.y, b.r); }
  ctx.globalAlpha = 1;

  if (flash > 0) {
    const pr = 1 - flash / 1.6, x = pr * (W + 260) - 130;
    ctx.save(); ctx.translate(x, 0); ctx.rotate(-0.11);
    ctx.globalAlpha = Math.sin(clamp(pr, 0, 1) * Math.PI) * 0.3;
    ctx.fillStyle = K.a; ctx.fillRect(-70, -110, 46, H + 220);
    ctx.globalAlpha *= 0.7; ctx.fillStyle = K.b; ctx.fillRect(-16, -110, 14, H + 220);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // Dunkelheit kriecht heran, wenn das Licht ausgeht
  const dark = state === 'over' && cause === 'dark' ? 0.6 : light < 6 && state === 'play' && fever <= 0 ? (1 - light / 6) * 0.5 : 0;
  if (dark > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.15, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(0,0,0,' + dark * 0.4 + ')'); g.addColorStop(1, 'rgba(0,0,0,' + dark + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  ctx.save(); ctx.translate(-gx, -gy);
  ctx.globalAlpha = 0.5; ctx.fillStyle = grain; ctx.fillRect(0, 0, W + 12, H + 12);
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.fillStyle = vign; ctx.fillRect(0, 0, W, H);

  // Anzeige
  const title = state === 'ready' && showTitle;
  const nxt = planets[Math.min(reached + 1, planets.length - 1)];
  if (title) { ctx.globalAlpha = 0.55; ctx.fillStyle = K.paper; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  else {
    drawMap(); drawLight();
    txt(String(Math.floor(score)), W / 2, 94, 36, K.cream, K.a, 1, Math.sin(t * 2.2) * 1.6);
    txt('Ziel: ' + nxt.name + ' · ' + nxt.label, W / 2, 114, 12, K.b, null, 0.85, 0);
  }
  if (intro > 0 && state !== 'over') txt('Druckfarbe: ' + K.name, W / 2, 134, 12, K.a, null, Math.min(1, intro), 0);
  if (flash > 0 && banner && state === 'play') {
    const f = Math.min(1, flash);
    txt(banner.a, W / 2, 160, 20 + (1 - f) * 5, K.a, null, f, 0);
    txt(banner.b, W / 2, 179, 11, K.cream, null, f * 0.9, 0);
    txt(banner.c, W / 2, 196, 11, K.b, null, f, 0);
  }
  for (const pp of pops) {
    const a = Math.min(1, pp.life * 2);
    txt(pp.a, pp.x, pp.y, 20, pp.col, K.paper, a, 0);
    if (pp.b) txt(pp.b, pp.x, pp.y + 16, 10.5, K.cream, null, a * 0.85, 0);
  }
  if (state === 'ready') {
    if (title) {
      const y0 = H * 0.13, bob = Math.sin(t * 1.3) * 3;
      txt('Trabant', W / 2, y0 + bob, 46, K.cream, K.b, 1, Math.sin(t * 0.8) * 2.4);
      txt('Druckfarbe: ' + K.name, W / 2, y0 + 24 + bob, 12, K.a, null, 0.85, 0);
      txt('Von der Sonne bis zum Rand des Universums', W / 2, y0 + 52, 14, K.cream, null, 0.95, 0);
      const y1 = H * 0.66;
      txt('Halten: Der Komet stürzt in den Schwerkrafttrichter', W / 2, y1, 12.5, K.cream, null, 0.85, 0);
      txt('und wird schneller', W / 2, y1 + 16, 12.5, K.cream, null, 0.85, 0);
      txt('Loslassen, wenn er wieder hinausschwingt', W / 2, y1 + 36, 12.5, K.cream, null, 0.85, 0);
      txt('Mehr Anlauf = weiter fliegen, Planeten überspringen', W / 2, y1 + 56, 12.5, K.cream, null, 0.85, 0);
      txt('Leuchtet ein Ziel auf, trifft die Bahn', W / 2, y1 + 76, 12, K.b, null, 0.85, 0);
      txt('Halten zum Starten', W / 2, y1 + 108, 15, K.a, null, 0.7 + Math.sin(t * 4) * 0.3, 0);
      if (best > 0) txt('Bestwert ' + best, W / 2, y1 + 128, 13, K.b, null, 0.85, 0);
    } else {
      txt('Halten zum Starten', W / 2, H * 0.82, 16, K.a, null, 0.7 + Math.sin(t * 4) * 0.3, 0);
    }
  }
  if (state === 'paused') {
    panel(62, H / 2 - 44, 236, 88);
    txt('Pause', W / 2, H / 2 - 8, 20, K.cream, null, 1, 0);
    txt('Tippen zum Weiterfliegen', W / 2, H / 2 + 20, 14, K.a, null, 1, 0);
  }
  if ((state === 'over' || state === 'win') && deadT > 0.4) {
    const y = H / 2 - 90, win = state === 'win';
    panel(30, y, 300, 180);
    const head = win ? 'Universum durchquert' : cause === 'crash' ? 'Zu tief gestürzt' : cause === 'lost' ? 'Ins Leere getrieben' : 'Das Licht ist erloschen';
    txt(head, W / 2, y + 38, 22, K.cream, null, 1, 0);
    const r = planets[reached];
    txt(win ? 'Rand des beobachtbaren Universums' : reached === 0 ? 'Noch an der Sonne' : 'Erreicht: ' + r.name, W / 2, y + 64, 13, K.cream, null, 0.85, 0);
    if (!win && reached > 0) txt(r.label, W / 2, y + 82, 11, K.b, null, 0.8, 0);
    txt('Punkte ' + Math.floor(score) + '   Bestwert ' + best, W / 2, y + 108, 14, K.b, null, 0.9, 0);
    if (deadT > 0.8) txt('Tippen für neue Farben', W / 2, y + 150, 15, K.a, null, 0.7 + Math.sin(t * 4) * 0.3, 0);
  }
}

// ---------- Start ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
fit();
grain = makeGrain();
reset();

document.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
document.addEventListener('pointerup', e => { e.preventDefault(); release(); });
document.addEventListener('pointercancel', release);
['touchstart', 'touchmove', 'touchend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('contextmenu', e => e.preventDefault());
const isKey = e => e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown';
addEventListener('keydown', e => {
  if (isKey(e)) { e.preventDefault(); if (!e.repeat) press(); }
  if (e.code === 'KeyP') pause();
});
addEventListener('keyup', e => { if (isKey(e)) { e.preventDefault(); release(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 120));
requestAnimationFrame(loop);
</script>
</body>
</html>
