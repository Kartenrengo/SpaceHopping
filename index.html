<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1830">
<meta name="mobile-web-app-capable" content="yes">
<title>Trabant</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%;
    background:#0E1830;
    overflow:hidden; overscroll-behavior:none;
    position:fixed; inset:0;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    transition: background 600ms ease;
  }
  #wrap { height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="tz" aria-label="Trabant – von der Sonne bis zum Rand des beobachtbaren Universums. Finger halten macht den Kometen schwer, loslassen lässt ihn fliegen"></canvas></div>
<script>
"use strict";
// ---------- Stellschrauben ----------
const W = 360; let H = 640;                  // Spielwelt-Breite; Höhe passt sich dem Handy an
const G = 1100, G_HOLD = 3600;               // Schwerkraft normal / beim Halten (Komet wird schwer)
const START_V = 260, MIN_V = 110, MAX_V = 1500;
const PERFECT = 0.22;                        // max. Winkel (sin) für eine perfekte Landung
const FEVER_CHAIN = 3, FEVER_T = 5;          // perfekte Landungen in Folge → Fieber für 5 s
const LIGHT_START = 25;                      // Sekunden Licht zu Beginn
const F = 'Georgia, serif';

const SETS = [
  { name: 'Mitternacht', paper: '#0E1830', deep: '#2B4785', a: '#FF4F79', b: '#6FE3C0', cream: '#EFE7D6' },
  { name: 'Tiefsee',     paper: '#06201E', deep: '#0F4A44', a: '#FF7A5C', b: '#7FE9D0', cream: '#E9F1E4' },
  { name: 'Traube',      paper: '#1A0E2A', deep: '#46237A', a: '#FFD166', b: '#EF476F', cream: '#F2E9F7' },
  { name: 'Rost',        paper: '#221208', deep: '#5A2A18', a: '#FF9A3C', b: '#6BC5B8', cream: '#F3E6D6' },
  { name: 'Moor',        paper: '#0B1A14', deep: '#1E4634', a: '#F2545B', b: '#C6F24E', cream: '#EDF2E4' },
  { name: 'Kobalt',      paper: '#0A1230', deep: '#1E3AA8', a: '#FF5CAA', b: '#FFE066', cream: '#E8ECFF' },
  { name: 'Asche',       paper: '#14131A', deep: '#3A3750', a: '#E0FF4F', b: '#FF6B6B', cream: '#EDEBE4' }
];

// Echte Entfernungen von der Sonne bzw. der Erde (NASA Planetary Fact Sheet, Voyager, Gaia, JWST).
// Ab Proxima: Lichtjahre; bei den fernsten Galaxien die Lichtlaufzeit.
const LJ = 9.461e12;
const STAGES = [
  { name: 'Merkur',  km: 57.9e6,   label: '58 Mio. km',   look: 'rock',  col: 'cream', size: 14 },
  { name: 'Venus',   km: 108.2e6,  label: '108 Mio. km',  look: 'veil',  col: 'a',     size: 25 },
  { name: 'Erde',    km: 149.6e6,  label: '150 Mio. km',  look: 'moon',  col: 'b',     size: 26 },
  { name: 'Mars',    km: 228.0e6,  label: '228 Mio. km',  look: 'rock',  col: 'a',     size: 18 },
  { name: 'Jupiter', km: 778.5e6,  label: '779 Mio. km',  look: 'bands', col: 'cream', size: 55 },
  { name: 'Saturn',  km: 1432e6,   label: '1,43 Mrd. km', look: 'ring',  col: 'a',     size: 50 },
  { name: 'Uranus',  km: 2867e6,   label: '2,87 Mrd. km', look: 'tilt',  col: 'b',     size: 40 },
  { name: 'Neptun',  km: 4515e6,   label: '4,52 Mrd. km', look: 'spot',  col: 'b',     size: 40 },
  { name: 'Pluto',   km: 5906e6,   label: '5,9 Mrd. km',  look: 'pluto', col: 'cream', size: 16, note: 'Kuipergürtel · New Horizons 2015' },
  { name: 'Heliopause', km: 18.1e9, label: '18 Mrd. km',  look: 'helio', size: 60, note: 'Rand der Sonnenblase · Voyager 1, 2012' },
  { name: 'Proxima Centauri b', km: 4.24 * LJ, label: '4,2 Lichtjahre', look: 'star', size: 34, note: 'nächster bekannter Exoplanet' },
  { name: 'TRAPPIST-1', km: 40.7 * LJ, label: '41 Lichtjahre', look: 'trappist', size: 30, note: 'sieben erdgroße Planeten' },
  { name: 'Orionnebel', km: 1344 * LJ, label: '1.344 Lichtjahre', look: 'nebula', size: 62, note: 'hier entstehen Sterne' },
  { name: 'Sagittarius A*', km: 27000 * LJ, label: '27.000 Lichtjahre', look: 'hole', size: 40, note: 'Schwarzes Loch im Zentrum der Milchstraße' },
  { name: 'Große Magellansche Wolke', km: 160000 * LJ, label: '160.000 Lichtjahre', look: 'cloud', size: 58, note: 'Nachbargalaxie' },
  { name: 'Andromeda', km: 2.5e6 * LJ, label: '2,5 Mio. Lichtjahre', look: 'spiral', size: 66, note: 'nächste große Galaxie' },
  { name: 'JADES-GS-z14-0', km: 13.4e9 * LJ, label: '13,4 Mrd. Lichtjahre', look: 'faint', size: 40, note: 'eine der fernsten Galaxien · JWST 2024' },
  { name: 'Hintergrundstrahlung', km: 13.8e9 * LJ, label: '13,8 Mrd. Lichtjahre', look: 'cmb', size: 70, note: 'Rand des beobachtbaren Universums' }
];
// Massstab logarithmisch: jede Verzehnfachung der Entfernung bringt gut zwei Huegel mehr.
// Innen 3–4 Huegel pro Ziel, der Sprung zu Proxima und zu JADES 11–12 Huegel.
{
  let prevKm = 0;
  STAGES.forEach((s, i) => {
    s.hills = i === 0 ? 3 : Math.max(3, Math.min(12, 3 + Math.round(2.4 * Math.log10(s.km / prevKm))));
    s.amp = Math.min(210, 95 + i * 7);
    s.len = Math.min(470, 300 + i * 10);
    s.bonus = Math.max(3, Math.min(10, s.hills * 0.9));     // Licht-Bonus fuer die naechste Strecke
    prevKm = s.km;
  });
}
const HILLS_TOTAL = STAGES.reduce((a, s) => a + s.hills, 0);

// ---------- Leinwand ----------
const cv = document.getElementById('tz'), ctx = cv.getContext('2d');
const meta = document.querySelector('meta[name=theme-color]');
let scale = 1, dpr = 1, grain, vign, dotsP;
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  H = Math.round(Math.min(820, Math.max(560, W * vh / vw)));
  scale = Math.min(vw / W, vh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  vign = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78);
  vign.addColorStop(0, 'rgba(6,8,18,0)');
  vign.addColorStop(1, 'rgba(6,8,18,0.55)');
}

// ---------- Druck-Helfer ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 110;
  const g = c.getContext('2d'), d = g.createImageData(110, 110);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = Math.random() < 0.42 ? 42 : 0;
  }
  g.putImageData(d, 0, 0);
  return ctx.createPattern(c, 'repeat');
}
function makeDots(col) {
  const c = document.createElement('canvas'); c.width = c.height = 4;
  const g = c.getContext('2d');
  g.fillStyle = col; g.beginPath(); g.arc(2, 2, 0.95, 0, 6.283); g.fill();
  return ctx.createPattern(c, 'repeat');
}
function wob(n, amp) {
  const a = [], p1 = Math.random() * 6.3, p2 = Math.random() * 6.3;
  const f1 = 2 + Math.floor(Math.random() * 2), f2 = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const u = i / n * 6.283;
    a.push((Math.sin(u * f1 + p1) * 0.62 + Math.sin(u * f2 + p2) * 0.38) * amp);
  }
  return a;
}
function inkPath(cx, cy, r, w, rot) {
  const n = w.length;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const u = i / n * 6.283 + rot, rr = r * (1 + w[i % n]);
    const x = cx + Math.cos(u) * rr, y = cy + Math.sin(u) * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
function txt(s, x, y, size, col, sh, al, j) {
  ctx.font = '400 ' + size.toFixed(1) + 'px ' + F;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.16);
  ctx.globalAlpha = al * 0.7; ctx.strokeStyle = K.paper; ctx.strokeText(s, x, y);
  if (sh) { ctx.globalAlpha = al * 0.6; ctx.fillStyle = sh; ctx.fillText(s, x - 2.5 + j, y + 2.5); }
  ctx.globalAlpha = al; ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}
function panel(x, y, w, h) {
  const j = Math.sin(t * 1.6) * 1.2;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.5; ctx.strokeStyle = K.b; ctx.strokeRect(x - 2.5 + j, y + 2.5, w, h);
  ctx.globalAlpha = 0.92; ctx.fillStyle = K.paper; ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 0.75; ctx.strokeStyle = K.cream; ctx.strokeRect(x, y, w, h);
  ctx.globalAlpha = 1;
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {} }

// ---------- Zustand ----------
let K = SETS[0], palBase = 0, best = 0, showTitle = true;
try { best = +localStorage.getItem('trabant.wings.best') || 0; } catch (_) {}
let state = 'ready', prev = 'play', holding = false;
let c, nodes, ends, genStage, stage, stageStart, light, score, chain, fever, airT, groundT, hillsDone;
let trail, bits, pops, specks, clouds, bodyVis;
let zoom = 1, camX = 0, camY = 0, bottomY = 200;
let t = 0, deadT = 0, flash = 0, shake = 0, intro = 0, banner = null, gx = 0, gy = 0;

function setPalette(i) {
  K = SETS[(palBase + i) % SETS.length];
  dotsP = makeDots(K.paper);
  document.body.style.background = K.paper;
  if (meta) meta.setAttribute('content', K.paper);
}

// ---------- Gelaende: Raumzeit-Huegel ----------
// Knoten wechseln zwischen Kuppe und Tal, dazwischen eine halbe Kosinuswelle
function genNext() {
  const i = Math.min(genStage, STAGES.length - 1), s = STAGES[i];
  let last = nodes[nodes.length - 1];
  for (let h = 0; h < s.hills; h++) {
    const ramp = h === s.hills - 1;
    const valley = { x: last.x + s.len * rnd(0.85, 1.15), y: s.amp * rnd(0.6, 1), peak: false };
    const peak = { x: valley.x + s.len * rnd(0.85, 1.15) * (ramp ? 1.25 : 1), y: -s.amp * (ramp ? 1.45 : rnd(0.55, 1)), peak: true };
    nodes.push(valley, peak);
    last = peak;
  }
  if (genStage < STAGES.length) ends.push({ x: last.x, i: genStage });
  genStage++;
}
function seg(x) {
  let lo = 0, hi = nodes.length - 2;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (nodes[m].x <= x) lo = m; else hi = m - 1; }
  return lo;
}
function ground(x) {
  const i = seg(x), a = nodes[i], b = nodes[i + 1], u = clamp((x - a.x) / (b.x - a.x), 0, 1);
  return a.y + (b.y - a.y) * (1 - Math.cos(Math.PI * u)) / 2;
}
function slope(x) {
  const i = seg(x), a = nodes[i], b = nodes[i + 1], u = clamp((x - a.x) / (b.x - a.x), 0, 1);
  return (b.y - a.y) * Math.PI / (2 * (b.x - a.x)) * Math.sin(Math.PI * u);
}

function visuals() {
  return { wr: wob(40, 0.028), wc: wob(34, 0.05), ox: rnd(-2.6, 2.6), oy: rnd(-2.6, 2.6), cs: rnd(-0.4, 0.4), phase: rnd(0, 6.283),
    pts: Array.from({ length: 70 }, () => ({ a: rnd(0, 6.283), r: Math.sqrt(Math.random()), s: rnd(0.5, 1.8), k: Math.random() })) };
}

function reset() {
  palBase = Math.floor(Math.random() * SETS.length);
  setPalette(0);
  nodes = [{ x: -500, y: 80, peak: false }, { x: 0, y: -70, peak: true }];
  ends = []; genStage = 0;
  genNext(); genNext();
  stage = 0; stageStart = 0; hillsDone = 0;
  c = { x: 0, y: -70, vx: START_V, vy: 0, onGround: true };
  light = LIGHT_START; score = 0; chain = 0; fever = 0; airT = 0; groundT = 0;
  holding = false; deadT = 0; flash = 0; shake = 0; banner = null;
  trail = []; bits = []; pops = [];
  bodyVis = visuals();
  zoom = 0.66; bottomY = STAGES[0].amp + 110; camX = c.x - W * 0.28; camY = bottomY - H / zoom;
  state = 'ready';
  intro = showTitle ? 0 : 2.4;
  specks = [];
  for (let i = 0; i < 110; i++) specks.push({ x: rnd(0, W * 3), y: rnd(0, H), s: rnd(0.5, 1.9), p: rnd(0.03, 0.15), a: rnd(0.2, 0.7), ph: rnd(0, 6.3), pk: Math.random() < 0.15 });
  clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: rnd(0, W * 3), y: rnd(40, H * 0.6), r: rnd(70, 170), w: wob(30, 0.12), sp: rnd(-0.06, 0.06) });
}

function burst(x, y, n, sp, cols) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = sp * (0.35 + Math.random());
    bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, r: rnd(0.8, 2.7), c: (cols || [K.a, K.b])[i % 2] });
  }
}
// Einblendung ueber dem Kometen, damit das Ziel am Himmel frei bleibt
function pop(a, b, col) { pops.push({ x: clamp(SHIP_SX() + 60, 80, W - 80), y: clamp(SHIP_SY() - 70, H * 0.45, H - 60), a, b, col: col || K.a, life: 1.4 }); }

// Landung: flach auf einem Abhang = perfekt, steil oder bergauf = holprig
function land(tx, ty, vt) {
  if (airT < 0.25) return vt;
  const sp = Math.hypot(c.vx, c.vy), sinA = Math.abs(c.vx * ty - c.vy * tx) / sp;
  if (ty > 0.05 && sinA < PERFECT) {
    chain++;
    const pts = fever > 0 ? 20 : 10;
    score += pts;
    vt = vt * 1.06 + 70;
    burst(SHIP_SX(), SHIP_SY(), 8, 70);
    if (chain >= FEVER_CHAIN) { chain = 0; fever = FEVER_T; pop('Fieber!', 'doppelte Punkte, mehr Tempo', K.b); buzz([20, 30, 20]); }
    else pop('Perfekt  +' + pts, airT > 1.3 ? 'weiter Sprung' : '');
    buzz(12);
  } else if (sinA > 0.55) {
    chain = 0;
    vt *= 0.6;
    shake = Math.max(shake, 0.12);
    pop('Holprig', '', K.cream);
  }
  if (airT > 1.3) score += fever > 0 ? 40 : 20;
  return vt;
}
const SHIP_SX = () => (c.x - camX) * zoom, SHIP_SY = () => (c.y - camY) * zoom;

function physics(dt) {
  const heavy = holding && state === 'play';
  const g = heavy ? G_HOLD : (state === 'night' ? G * 1.5 : G);
  c.vy += g * dt;
  if (fever > 0) c.vx += 200 * dt;
  c.x += c.vx * dt; c.y += c.vy * dt;
  const gy = ground(c.x);
  if (c.y >= gy) {
    const s = slope(c.x), n = Math.hypot(1, s), tx = 1 / n, ty = s / n;
    let vt = c.vx * tx + c.vy * ty;
    if (!c.onGround) vt = land(tx, ty, vt);
    vt *= 1 - 0.06 * dt;
    vt = clamp(vt, MIN_V / tx, MAX_V);
    c.y = gy; c.vx = vt * tx; c.vy = vt * ty; c.onGround = true; airT = 0;
  } else if (c.y < gy - 1.5) {
    if (c.onGround) { c.onGround = false; airT = 0; }
    airT += dt;
    if (c.vx < MIN_V) c.vx = MIN_V;
  }
}

function arrive(i) {
  const s = STAGES[i];
  stage = i + 1; stageStart = c.x; hillsDone += s.hills;
  flash = 1.6;
  score += 50;
  if (i === STAGES.length - 1) {
    state = 'win'; deadT = 0; holding = false;
    if (score > best) saveBest();
    buzz([40, 60, 40, 60, 80]);
    return;
  }
  const bonus = STAGES[i + 1].bonus;
  light += bonus;
  banner = { a: s.name + ' erreicht', b: s.label + (s.note ? ' · ' + s.note : ''), c: '+' + Math.round(bonus) + ' s Licht · +50' };
  setPalette(stage);
  bodyVis = visuals();
  buzz([25, 40, 25]);
}
function saveBest() { best = Math.floor(score); try { localStorage.setItem('trabant.wings.best', String(best)); } catch (_) {} }

// ---------- Eingabe ----------
let wantFull = true;
function goFullscreen() {
  if (!wantFull) return; wantFull = false;
  const el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen;
  if (rf) Promise.resolve(rf.call(el)).then(() => {
    try { screen.orientation.lock('portrait').catch(() => {}); } catch (_) {}
  }).catch(() => {});
}
function press() {
  goFullscreen();
  if (state === 'ready') { state = 'play'; showTitle = false; holding = true; }
  else if (state === 'play') holding = true;
  else if (state === 'paused') state = prev;
  else if ((state === 'over' || state === 'win') && deadT > 0.8) reset();
}
function release() { holding = false; }
function pause() { if (state === 'play' || state === 'night') { prev = state; state = 'paused'; holding = false; } }

// ---------- Logik ----------
function update(dt) {
  if (Math.random() < 0.3) { gx = (Math.random() * 9) | 0; gy = (Math.random() * 9) | 0; }
  if (state === 'paused') return;
  t += dt;
  if (flash > 0) flash -= dt;
  if (shake > 0) shake -= dt;
  if (intro > 0) intro -= dt;
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 70 * dt; b.vx *= 0.985; b.life -= dt * 1.05;
    if (b.life <= 0) bits.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { const pp = pops[i]; pp.life -= dt; pp.y -= 20 * dt; if (pp.life <= 0) pops.splice(i, 1); }
  if (pops.length > 2) pops.shift();

  if (state === 'play' || state === 'night') {
    const x0 = c.x;
    for (let k = 0; k < 4; k++) physics(dt / 4);
    score += (c.x - x0) / 40 * (fever > 0 ? 2 : 1);
    if (fever > 0) fever -= dt;
    while (ends.length && c.x >= ends[0].x) { const e = ends.shift(); arrive(e.i); if (state === 'win') break; }
    while (nodes[nodes.length - 1].x < camX + W / 0.3 + 600) genNext();
    while (nodes.length > 4 && nodes[2].x < camX - 300) nodes.shift();
    if (state === 'play') {
      light -= dt;
      if (light <= 0) { light = 0; state = 'night'; holding = false; groundT = 0; pop('Das Licht erlischt', 'der Komet gleitet aus', K.cream); }
    } else if (state === 'night') {
      // Wie bei Tiny Wings: Ist das Licht weg, endet der Flug bei der naechsten Landung
      c.vx *= 1 - 0.5 * dt;
      groundT = c.onGround ? groundT + dt : 0;
      if (groundT > 0.6) { state = 'over'; deadT = 0; if (score > best) saveBest(); }
    }
  } else if (state === 'over' || state === 'win') {
    deadT += dt;
    if (state === 'win') { for (let k = 0; k < 4; k++) physics(dt / 4); while (nodes[nodes.length - 1].x < camX + W / 0.3 + 600) genNext(); }
  }

  if (state !== 'ready') { trail.push({ x: c.x, y: c.y }); if (trail.length > 30) trail.shift(); }

  // Kamera: zoomt heraus, wenn der Komet hoch fliegt
  const si = Math.min(stage, STAGES.length - 1);
  bottomY += (STAGES[si].amp * 1.45 * 0.75 + 110 - bottomY) * Math.min(1, dt * 1.5);
  const need = bottomY - (c.y - 90);
  const zt = clamp(H * 0.92 / need, 0.3, 0.66);
  zoom += (zt - zoom) * Math.min(1, dt * 3);
  camX = c.x - W * 0.28 / zoom;
  camY = bottomY - H / zoom;
}

// ---------- Zeichnen: Himmelskoerper ----------
function ringHalf(x, y, b, sat, front) {
  const rx = b * (sat ? 2.25 : 1.75), ry = b * (sat ? 0.62 : 0.4);
  const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : 2 * Math.PI;
  ctx.save(); ctx.translate(x, y); ctx.rotate(sat ? -0.32 : 1.35);
  ctx.strokeStyle = K.cream;
  ctx.globalAlpha = sat ? 0.9 : 0.6; ctx.lineWidth = sat ? 4 : 2;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, a0, a1); ctx.stroke();
  if (sat) { ctx.globalAlpha = 0.6; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.8, ry * 0.8, 0, a0, a1); ctx.stroke(); }
  ctx.restore(); ctx.globalAlpha = 1;
}
function inkBall(x, y, r, col, sh, v) {
  const br = 1 + 0.35 * Math.sin(t * 0.9 + v.phase), crot = -t * v.cs;
  ctx.globalAlpha = 0.5; ctx.fillStyle = sh; inkPath(x - v.ox * br, y - v.oy * br, r, v.wc, crot); ctx.fill();

function drawTerrain() {
  const pts = [];
  for (let sx = -8; sx <= W + 8; sx += 5) { const wx = camX + sx / zoom; pts.push([sx, (ground(wx) - camY) * zoom]); }
  // Fuellung
  ctx.beginPath(); ctx.moveTo(-10, H + 10);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(W + 10, H + 10); ctx.closePath();
  ctx.globalAlpha = 1; ctx.fillStyle = K.deep; ctx.fill();
  ctx.globalAlpha = 0.25; ctx.fillStyle = dotsP; ctx.fill();
  // Raumzeit-Gitter: Hoehenlinien und senkrechte Linien
  ctx.strokeStyle = K.cream; ctx.lineWidth = 1;

    ctx.globalAlpha = al; ctx.setLineDash([3, 6]); ctx.beginPath();
    pts.forEach((p, i) => { const y = p[1] + off * zoom; if (i) ctx.lineTo(p[0], y); else ctx.moveTo(p[0], y); });
    ctx.stroke();
  }
  ctx.setLineDash([]);
  const step = 70, first = Math.ceil(camX / step) * step;
  ctx.globalAlpha = 0.09;
  for (let wx = first; wx < camX + W / zoom; wx += step) {
    const sx = (wx - camX) * zoom, sy = (ground(wx) - camY) * zoom;
    ctx.beginPath(); ctx.moveTo(sx, sy + 6); ctx.lineTo(sx, H); ctx.stroke();
  }

  ctx.globalAlpha = 0.5; ctx.strokeStyle = K.a; ctx.lineWidth = 3;

  ctx.globalAlpha = 0.95; ctx.strokeStyle = K.b; ctx.lineWidth = 3;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  ctx.globalAlpha = 1;
  // Zielfahne am Ende der Strecke
  for (const e of ends) {
    const sx = (e.x - camX) * zoom;
    if (sx < -20 || sx > W + 20) continue;
    const sy = (ground(e.x) - camY) * zoom;

    if (!win && stage > 0) txt(STAGES[stage - 1].label, W / 2, y + 82, 11, K.b, null, 0.8, 0);
    txt('Punkte ' + Math.floor(score) + '   Bestwert ' + best, W / 2, y + 108, 14, K.b, null, 0.9, 0);
    if (deadT > 0.8) txt('Tippen für neue Farben', W / 2, y + 150, 15, K.a, null, 0.7 + Math.sin(t * 4) * 0.3, 0);
  }
}

// ---------- Start ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
fit();
grain = makeGrain();
reset();

document.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
document.addEventListener('pointerup', e => { e.preventDefault(); release(); });
document.addEventListener('pointercancel', release);
['touchstart', 'touchmove', 'touchend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('contextmenu', e => e.preventDefault());
const isKey = e => e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown';
addEventListener('keydown', e => {
  if (isKey(e)) { e.preventDefault(); if (!e.repeat) press(); }
  if (e.code === 'KeyP') pause();
});
addEventListener('keyup', e => { if (isKey(e)) { e.preventDefault(); release(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 120));
requestAnimationFrame(loop);
</script>
