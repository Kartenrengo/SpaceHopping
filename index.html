<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<title>Space Hopping</title>
<style>
  :root { --bg: #05060f; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ---------- Stellschrauben ----------
const W = 360; let H = 640;          // logische Spielfläche; Höhe passt sich dem Handy an
const GRAVITY = 1500;                // px/s²
const FLAP = -430;                   // Sprunggeschwindigkeit beim Tippen
const MAX_FALL = 620;
const SHIP_X = 95, SHIP_R = 13;
const PIPE_W = 64;
const POINTS_PER_LEVEL = 5;
const MAX_SHIFT = 170;               // max. Höhensprung zwischen zwei Lücken
// Level 1 → Endstufe (wie beim Vogelspiel)
const SPEED = [140, 265], GAP = [178, 112], SPACING = [235, 160];
const LEVELS_TO_MAX = 8;             // ab Level 9 bleibt es auf Maximum
// Jede Stufe ist ein Abschnitt des Sonnensystems
const STAGES = [
  { name: "Merkur",  color: "#a9a39b", ring: false },
  { name: "Venus",   color: "#e3c27a", ring: false },
  { name: "Erde",    color: "#3b7fd6", ring: false },
  { name: "Mars",    color: "#c4532e", ring: false },
  { name: "Jupiter", color: "#c99a6b", ring: false },
  { name: "Saturn",  color: "#dcc58e", ring: true  },
  { name: "Uranus",  color: "#8fd3dc", ring: false },
  { name: "Neptun",  color: "#3d5bd8", ring: false },
  { name: "Kuipergürtel", color: "#7d6f8c", ring: false },
];

// ---------- Canvas & Skalierung ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  H = Math.round(Math.min(820, Math.max(560, W * vh / vw)));
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = W * scale + "px";
  cv.style.height = H * scale + "px";
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- Speicher ----------
let best = 0;
try { best = +localStorage.getItem("spacehop.best") || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem("spacehop.best", best); } catch (e) {} }
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------- Hintergrund ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.15, 1) });

// ---------- Zustand ----------
let state = "ready";   // ready | play | dead | pause
let ship, pipes, score, level, distToNext, t, deadT, flashT, levelBanner, particles;

function lerp(a, b, k) { return a + (b - a) * k; }
function params() {
  const k = Math.min(1, (level - 1) / LEVELS_TO_MAX);
  return { speed: lerp(SPEED[0], SPEED[1], k), gap: lerp(GAP[0], GAP[1], k), spacing: lerp(SPACING[0], SPACING[1], k) };
}
function stage() { return STAGES[Math.min(level - 1, STAGES.length - 1)]; }

function makeRocks(h) {   // Asteroidenbrocken für eine Säulenhälfte
  const rocks = [];
  for (let y = 0; y < h + 20; y += rnd(18, 26))
    rocks.push({ dx: rnd(-6, 6), y, r: rnd(15, 22), shade: rnd(0.75, 1.1) });
  return rocks;
}
function addPipe(x) {
  const p = params(), margin = 70;
  const lo = margin + p.gap / 2, hi = H - margin - p.gap / 2;
  const prev = pipes.length ? pipes[pipes.length - 1].gy : H / 2;
  // Höhenunterschied zur vorigen Lücke begrenzen, damit jeder Wechsel schaffbar bleibt
  const gy = Math.max(lo, Math.min(hi, prev + rnd(-MAX_SHIFT, MAX_SHIFT)));
  pipes.push({ x, gy, gap: p.gap, passed: false, top: makeRocks(gy - p.gap / 2), bot: makeRocks(H - (gy + p.gap / 2)) });
}

function reset() {
  ship = { y: H * 0.45, vy: 0, rot: 0 };
  pipes = []; particles = [];
  score = 0; level = 1; t = 0; deadT = 0; flashT = 0;
  levelBanner = 2.2;
  distToNext = 0;
  addPipe(W + 60);
}
reset();

// ---------- Eingabe ----------
let wantFull = true;
function goFullscreen() {
  if (!wantFull) return; wantFull = false;
  const el = document.documentElement;
  const rf = el.requestFullscreen || el.webkitRequestFullscreen;
  if (rf) Promise.resolve(rf.call(el)).then(() => {
    try { screen.orientation.lock("portrait").catch(() => {}); } catch (e) {}
  }).catch(() => {});
}
function press() {
  goFullscreen();
  if (state === "ready") { state = "play"; flap(); }
  else if (state === "play") flap();
  else if (state === "pause") state = "play";
  else if (state === "dead" && deadT > 0.6) { reset(); state = "ready"; }
}
function flap() {
  ship.vy = FLAP;
  for (let i = 0; i < 5; i++)
    particles.push({ x: SHIP_X - 14, y: ship.y + rnd(-4, 4), vx: rnd(-160, -60), vy: rnd(-30, 60), life: rnd(0.25, 0.5), c: "#ffb347" });
}
window.addEventListener("pointerdown", e => { e.preventDefault(); press(); }, { passive: false });
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") { e.preventDefault(); if (!e.repeat) press(); }
  if (e.code === "KeyP" && state === "play") state = "pause";
});
window.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") state = "pause"; });

// ---------- Logik ----------
function die() {
  state = "dead"; deadT = 0; flashT = 0.25;
  buzz(120);
  if (score > best) { best = score; saveBest(); }
  for (let i = 0; i < 28; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(60, 260);
    particles.push({ x: SHIP_X, y: ship.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 0.9), c: i % 2 ? "#ff6a3d" : "#ffe08a" });
  }
}
function hit(p) {
  if (SHIP_X + SHIP_R < p.x || SHIP_X - SHIP_R > p.x + PIPE_W) return false;
  // nächster Punkt des Rechtecks zum Kreis
  const cx = Math.max(p.x, Math.min(SHIP_X, p.x + PIPE_W));
  const topB = p.gy - p.gap / 2, botB = p.gy + p.gap / 2;
  if (ship.y - SHIP_R < topB) { const cy = Math.min(ship.y, topB); if (Math.hypot(SHIP_X - cx, ship.y - cy) < SHIP_R) return true; }
  if (ship.y + SHIP_R > botB) { const cy = Math.max(ship.y, botB); if (Math.hypot(SHIP_X - cx, ship.y - cy) < SHIP_R) return true; }
  return false;
}

function update(dt) {
  t += dt;
  const p = params();
  for (const s of stars) { s.x -= s.z * (state === "play" ? p.speed : 40) * 0.25 * dt; if (s.x < 0) { s.x += W; s.y = rnd(0, H); } }
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  if (flashT > 0) flashT -= dt;
  if (levelBanner > 0) levelBanner -= dt;

  if (state === "ready") { ship.y = H * 0.45 + Math.sin(t * 3) * 8; ship.rot = 0; return; }
  if (state === "pause") return;
  if (state === "dead") {
    deadT += dt;
    if (ship.y < H + 40) { ship.vy = Math.min(ship.vy + GRAVITY * dt, MAX_FALL); ship.y += ship.vy * dt; ship.rot += 6 * dt; }
    return;
  }

  ship.vy = Math.min(ship.vy + GRAVITY * dt, MAX_FALL);
  ship.y += ship.vy * dt;
  ship.rot = Math.max(-0.5, Math.min(1.2, ship.vy / 550));
  if (Math.random() < 0.6) particles.push({ x: SHIP_X - 14, y: ship.y + rnd(-2, 2), vx: rnd(-120, -60), vy: rnd(-15, 15), life: 0.25, c: "#7fd8ff" });

  for (const q of pipes) {
    q.x -= p.speed * dt;
    if (!q.passed && q.x + PIPE_W < SHIP_X - SHIP_R) {
      q.passed = true; score++;
      if (score % POINTS_PER_LEVEL === 0) { level++; levelBanner = 2.2; buzz([40, 60, 40]); }
    }
  }
  pipes = pipes.filter(q => q.x > -PIPE_W - 20);
  const last = pipes[pipes.length - 1];
  if (!last || last.x < W - p.spacing) addPipe((last ? last.x : W) + p.spacing);

  if (ship.y - SHIP_R < 0 || ship.y + SHIP_R > H) return die();
  for (const q of pipes) if (hit(q)) return die();
}

// ---------- Zeichnen ----------
function drawPlanet() {
  const st = stage();
  const x = W * 0.72, y = H * 0.3, r = 90;
  ctx.save();
  ctx.globalAlpha = 0.35;
  if (st.ring) { ctx.strokeStyle = st.color; ctx.lineWidth = 10; ctx.beginPath(); ctx.ellipse(x, y, r * 1.8, r * 0.4, -0.3, Math.PI, Math.PI * 2); ctx.stroke(); }
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, st.color); g.addColorStop(1, "#05060f");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (st.ring) { ctx.strokeStyle = st.color; ctx.lineWidth = 10; ctx.beginPath(); ctx.ellipse(x, y, r * 1.8, r * 0.4, -0.3, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
}
function drawRocks(rocks, x, y0, dir) {
  for (const k of rocks) {
    const cx = x + PIPE_W / 2 + k.dx, cy = y0 + dir * k.y;
    const g = ctx.createRadialGradient(cx - k.r * 0.4, cy - k.r * 0.4, 2, cx, cy, k.r);
    const s = k.shade;
    g.addColorStop(0, `rgb(${150 * s},${135 * s},${125 * s})`);
    g.addColorStop(1, `rgb(${55 * s},${48 * s},${50 * s})`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, k.r + 4, 0, Math.PI * 2); ctx.fill();
  }
}
function drawShip() {
  ctx.save();
  ctx.translate(SHIP_X, ship.y); ctx.rotate(ship.rot);
  if (state === "dead") ctx.globalAlpha = Math.max(0, 1 - deadT * 1.5);
  ctx.fillStyle = "#e8edf5";
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.quadraticCurveTo(6, -11, -12, -9); ctx.lineTo(-12, 9); ctx.quadraticCurveTo(6, 11, 18, 0); ctx.fill();
  ctx.fillStyle = "#ff5a4e";
  ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(-16, -16); ctx.lineTo(-12, -6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 9); ctx.lineTo(-16, 16); ctx.lineTo(-12, 6); ctx.fill();
  ctx.fillStyle = "#4fc3f7"; ctx.beginPath(); ctx.arc(5, 0, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function text(s, x, y, size, color, align = "center") {
  ctx.font = `700 ${size}px system-ui, -apple-system, Roboto, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = "#05060f"; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function draw() {
  ctx.fillStyle = "#05060f"; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = 0.3 + s.z * 0.7; ctx.fillStyle = "#fff"; ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2); }
  ctx.globalAlpha = 1;
  drawPlanet();
  for (const q of pipes) {
    drawRocks(q.top, q.x, q.gy - q.gap / 2 - 14, -1);
    drawRocks(q.bot, q.x, q.gy + q.gap / 2 + 14, 1);
  }
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life * 2); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  drawShip();

  if (state !== "ready") text(String(score), W / 2, 64, 52, "#fff");
  text(`Level ${level} · ${stage().name}`, 14, 22, 15, "#9fb3d9", "left");
  text(`Best ${best}`, W - 14, 22, 15, "#9fb3d9", "right");

  if (levelBanner > 0 && state === "play" && level > 1) {
    ctx.globalAlpha = Math.min(1, levelBanner);
    text(`Level ${level}`, W / 2, H * 0.36, 40, "#ffe08a");
    text(stage().name, W / 2, H * 0.36 + 40, 22, "#fff");
    ctx.globalAlpha = 1;
  }
  if (state === "ready") {
    text("SPACE HOPPING", W / 2, H * 0.22, 38, "#ffe08a");
    text("Tippen zum Schub geben", W / 2, H * 0.62, 20, "#fff");
    text("Fliege durch die Lücken im Asteroidengürtel", W / 2, H * 0.62 + 30, 14, "#9fb3d9");
    if (best) text(`Bestwert: ${best}`, W / 2, H * 0.62 + 60, 16, "#9fb3d9");
  }
  if (state === "pause") { text("Pause", W / 2, H * 0.42, 40, "#fff"); text("Tippen zum Weiterfliegen", W / 2, H * 0.42 + 40, 18, "#9fb3d9"); }
  if (state === "dead" && deadT > 0.3) {
    ctx.fillStyle = "rgba(5,6,15,0.55)"; ctx.fillRect(40, H * 0.3, W - 80, 220);
    text("Crash!", W / 2, H * 0.3 + 40, 36, "#ff6a3d");
    text(`Punkte ${score}`, W / 2, H * 0.3 + 90, 22, "#fff");
    text(`Bestwert ${best}`, W / 2, H * 0.3 + 122, 18, "#9fb3d9");
    text(`erreicht: ${stage().name}`, W / 2, H * 0.3 + 152, 16, "#9fb3d9");
    if (deadT > 0.6) text("Tippen für neuen Flug", W / 2, H * 0.3 + 192, 16, "#ffe08a");
  }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 2})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- Schleife ----------
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
